name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dispatchlab_owner
          POSTGRES_PASSWORD: local-only-owner
          POSTGRES_DB: dispatchlab_test
        ports: ["55439:5432"]
        options: >-
          --health-cmd "pg_isready -U dispatchlab_owner -d dispatchlab_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://dispatchlab_owner:local-only-owner@127.0.0.1:55439/dispatchlab_test
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check && npm run lint && npm run typecheck
      - run: npm test && npm run test:integration
      - run: npm run build
      - name: Configure isolated E2E runtime
        run: |
          printf '%s\n' "DATABASE_URL=$TEST_DATABASE_URL" "SIGNING_SECRET=ci-only-signing-secret-at-least-24-characters" "MODE=local" > apps/worker/.dev.vars
          printf '%s\n' "SIGNING_SECRET=ci-only-signing-secret-at-least-24-characters" > apps/receiver/.dev.vars
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
